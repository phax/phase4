global.debug=false
global.production=false
global.nostartupinfo=true
global.datapath=generated/

phase4.manager.inmemory=true
phase4.endpoint.address=http://localhost-dummy/as4

# Test keystore with the two aliases mh-a and mh-b.
# Self signed, created for this module only - see src/test/resources/keys.
org.apache.wss4j.crypto.merlin.keystore.file=keys/mh-test.p12
org.apache.wss4j.crypto.merlin.keystore.password=mh-test
org.apache.wss4j.crypto.merlin.keystore.type=pkcs12
org.apache.wss4j.crypto.merlin.keystore.alias=mh-a
org.apache.wss4j.crypto.merlin.keystore.private.password=mh-test

# The same file acts as the trust store, because both certificates are self signed
org.apache.wss4j.crypto.merlin.truststore.file=keys/mh-test.p12
org.apache.wss4j.crypto.merlin.truststore.password=mh-test
org.apache.wss4j.crypto.merlin.truststore.type=pkcs12
